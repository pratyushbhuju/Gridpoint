
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRIDPOINT | Warehouse Optimization</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        nav a {
            text-decoration: none;
            color: #374151;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
            color: #111827;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            max-width: 650px;
            margin: 0 auto 35px;
            font-size: 18px;
            line-height: 1.6;
            color: #6b7280;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 30px 8% 80px;
        }

        .feature-card {
            background: white;
            width: 280px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .feature-card h3 {
            margin-bottom: 12px;
            color: #111827;
        }

        .feature-card p {
            line-height: 1.5;
            color: #6b7280;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: #d1d5db;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 38px;
            }

            nav {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">GRIDPOINT</div>
        <a href="/warehouse/">Warehouse Optimizer</a>
    </nav>

    <section class="hero">
        <h1>Where Should Your <span>Warehouse</span> Go?</h1>

        <p>
            GRIDPOINT helps you find efficient warehouse locations
            by analyzing neighborhood coordinates, daily orders,
            transportation costs, and delivery distances.
        </p>

        <a href="/warehouse/" class="button">
            Start Optimizing
        </a>
    </section>

   
    <footer>
        <p>GRIDPOINT &copy; 2026 | Warehouse Location Optimization</p>
    </footer>

</body>
</html>
